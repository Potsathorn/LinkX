name: linkx_tester
description: "Build, validate and test deeplinks from a JSON spec."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  gal: ^2.3.3
  uuid: ^4.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  go_router: ^17.5.0
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/spec/
